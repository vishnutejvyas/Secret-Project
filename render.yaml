services:
  - type: web
    name: avanthi-hangout-api
    runtime: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: GOOGLE_SHEET_WEBAPP_URL
        sync: false
      - key: ALLOWED_ORIGIN
        sync: false